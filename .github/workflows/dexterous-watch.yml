name: Dexterous paper watch

on:
  schedule:
    # 09:35 Asia/Shanghai. API indexing can lag announcements; use a rolling window.
    # GitHub schedules are best-effort and can run late.
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '回看天数：平时 7 天；中断后可补查 14 或 30 天'
        type: choice
        required: true
        default: '7'
        options:
          - '7'
          - '14'
          - '30'

permissions:
  contents: write

concurrency:
  group: dexterous-paper-watch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_BRANCH: bot/dexterous-watch
      DATA_DIR: .
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate watcher behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Preserve discoveries waiting in the candidate branch
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git ls-remote --heads origin "refs/heads/$BOT_BRANCH" | cut -f1)"
          printf 'PREVIOUS_BOT_SHA=%s\n' "$previous" >> "$GITHUB_ENV"
          if [ -n "$previous" ]; then
            git fetch origin "refs/heads/$BOT_BRANCH:refs/remotes/origin/$BOT_BRANCH"
            # An unreadable existing queue is an error, not an empty backlog.
            git show "$previous:candidates.json" > "$RUNNER_TEMP/previous-dexterous-candidates.json"
          fi

      - name: Fetch recent arXiv candidates
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$LOOKBACK_DAYS" in 7|14|30) ;; *) printf 'Invalid lookback window.\n' >&2; exit 1 ;; esac
          args=(--days "$LOOKBACK_DAYS")
          if [ -f "$RUNNER_TEMP/previous-dexterous-candidates.json" ]; then
            args+=(--previous-candidates "$RUNNER_TEMP/previous-dexterous-candidates.json")
          fi
          python3 scripts/dexterous_watch.py --data-dir "$DATA_DIR" "${args[@]}"

      - name: Prepare the discovery summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/watch_report.py "$DATA_DIR/watch.json" >> "$GITHUB_STEP_SUMMARY"

      # Discovery is a durable input queue, not a second approval request.
      # Only Codex creates the reviewed-paper PR that the maintainer merges.
      - name: Save candidates for Codex without opening a pull request
        run: bash scripts/publish_candidates.sh

      - name: Explain a failed run
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'

          ### 本次未完成
          请检查上方失败步骤。arXiv 连接或分页失败时不会发布半份检索结果；可稍后手动重跑。
          若保存候选分支失败，请检查 contents: write 权限、机器人分支保护或并发更新，再重跑。无需开启 Actions 创建 PR 权限。
          完整设置与审核步骤见仓库的 `docs/GITHUB_ACTIONS_SETUP.zh-CN.md`。
          NOTE
