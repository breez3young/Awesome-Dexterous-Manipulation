    <path d="M944 234L974 225L1003 274L960 287Z" stroke="#3e5949" stroke-opacity="0.4"/>
    <circle cx="964" cy="251" r="6" stroke="#3e5949" stroke-width="1.5"/>
    <path d="M949 313L955 328L1019 310L1013 295" fill="#faf8f3" stroke="#3e5949" stroke-width="2"/>

    <path d="M929 264L889 236L877 191L905 169" stroke="#3e5949" stroke-width="20"/>
